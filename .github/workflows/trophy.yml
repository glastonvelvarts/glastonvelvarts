
name: Update GitHub Trophies

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: "username=glastonvelvarts&theme=onedark&no-frame=true&no-bg=true&column=7&margin-w=15&margin-h=15"
          path: .github/assets/github-trophy.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/github-trophy.svg
          git commit -m "chore: update GitHub trophies" || exit 0
          git push
